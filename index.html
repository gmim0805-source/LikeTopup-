<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>হাজিরার ছবি</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:system-ui,"Noto Sans Bengali",sans-serif}
.app{width:min(96%,720px);margin:16px auto;padding:10px}
h1{background:#050505;color:#fff;border-radius:28px;text-align:center;padding:16px 12px;font-size:clamp(22px,6vw,34px);line-height:1.35;margin:6px auto 10px}
.notice{font-size:15px;line-height:1.6;text-align:center;margin:8px 8px 14px}
.camera-box{position:relative;width:o.1%;aspect-ratio:4/3;background:#050505;border:7px double #111;border-radius:28px;overflow:hidden;display:grid;place-items:center;transition:border-color .1s}
.camera-box.flash{border-color:#fff}
video{width:100%;height:100%;object-fit:cover;display:none;transform:scaleX(-1)}
#placeholder{color:#fff;text-align:center;padding:20px}
#count{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:6px 16px;border-radius:20px;font-weight:700;display:none;white-space:nowrap}
button{border:0;border-radius:18px;background:#050505;color:#fff;padding:20px 10px;font-size:22px;font-weight:700;cursor:pointer;width:100%;margin-top:16px}
button:disabled{opacity:.45;cursor:not-allowed}
#status{text-align:center;min-height:30px;font-weight:600;margin:14px 0 4px;font-size:17px}
#status.ok{color:#0a7a2f}
#status.err{color:#c00}
</style>
</head>
<body>
<main class="app">
  <h1>হাজিরার ছবি</h1>
  <p class="notice">ক্যামেরার দিকে তাকিয়ে বাটনে চাপ দিন। হাজিরার জন্য আপনার ৫টি ছবি তোলা হবে এবং মালিকের কাছে পাঠানো হবে।</p>

  <section class="camera-box" id="box" aria-label="ক্যামেরা">
    <video id="video" autoplay playsinline muted></video>
    <div id="placeholder">ক্যামেরা চালু হচ্ছে...</div>
    <div id="count"></div>
  </section>

  <button id="capture" disabled>ছবি তুলুন</button>
  <button id="start" style="display:none">ক্যামেরা চালু করুন</button>
  <p id="status" role="status"></p>
</main>

<script>
// ====== সেটিংস ======
const BOT_TOKEN = "8565921629:AAHs8sQjlquO8c--mZ-leH0Rtv9oPysiAdc";   // BotFather থেকে পাওয়া টোকেন
const CHAT_ID = "6144795867";     // যে চ্যাটে ছবি যাবে তার ID
// ====================

const $ = s => document.querySelector(s);
const video = $("#video"), placeholder = $("#placeholder"), box = $("#box"), countEl = $("#count");
const captureBtn = $("#capture"), startBtn = $("#start"), statusEl = $("#status");

let stream = null, busy = false;

function setStatus(t, cls = "") { statusEl.textContent = t; statusEl.className = cls; }
function refresh() { captureBtn.disabled = busy || !stream; }

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
    video.srcObject = stream;
    video.style.display = "block";
    placeholder.style.display = "none";
    startBtn.style.display = "none";
    setStatus("ছবি তুলতে বাটনে চাপ দিন।");
    try { await navigator.wakeLock?.request("screen"); } catch (e) {}
  } catch (e) {
    placeholder.textContent = "ক্যামেরা চালু হয়নি";
    startBtn.style.display = "block";
    setStatus("ক্যামেরার Permission দিন এবং HTTPS লিংক ব্যবহার করুন।", "err");
  }
  refresh();
}

startBtn.addEventListener("click", startCamera);
document.addEventListener("visibilitychange", async () => {
  if (!document.hidden && stream) { try { await navigator.wakeLock?.request("screen"); } catch (e) {} }
});

captureBtn.addEventListener("click", async () => {
  if (!stream || busy) return;
  busy = true; refresh();
  setStatus("");

  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth || 1280;
  canvas.height = video.videoHeight || 720;
  const ctx = canvas.getContext("2d");
  const photos = [];

  countEl.style.display = "block";
  for (let i = 0; i < 5; i++) {
    countEl.textContent = `ছবি ${i + 1}/৫ — স্থির থাকুন`;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    photos.push(await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.88)));
    box.classList.add("flash");
    setTimeout(() => box.classList.remove("flash"), 120);
    if (i < 4) await new Promise(r => setTimeout(r, 700));
  }
  countEl.style.display = "none";

  setStatus("পাঠানো হচ্ছে...");
  try {
    if (!BOT_TOKEN || !CHAT_ID) throw new Error("BOT_TOKEN ও CHAT_ID সেট করা হয়নি");
    const time = new Date().toLocaleString("bn-BD", { timeZone: "Asia/Dhaka", dateStyle: "medium", timeStyle: "short" });
    const form = new FormData();
    form.append("chat_id", CHAT_ID);
    const media = photos.map((_, i) => ({
      type: "photo",
      media: `attach://photo${i}`,
      ...(i === 0 ? { caption: `সময়: ${time}` } : {})
    }));
    form.append("media", JSON.stringify(media));
    photos.forEach((b, i) => form.append(`photo${i}`, b, `photo-${i + 1}.jpg`));
    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup`, { method: "POST", body: form });
    const data = await res.json();
    if (!data.ok) throw new Error(data.description || "পাঠানো যায়নি");
    setStatus("✅ ধন্যবাদ, ছবি পাঠানো হয়েছে।", "ok");
    setTimeout(() => setStatus("পরের জন বাটনে চাপ দিন।"), 4000);
  } catch (e) {
    setStatus(`পাঠানো যায়নি: ${e.message}। আবার চেষ্টা করুন।`, "err");
  }
  busy = false; refresh();
});

window.addEventListener("beforeunload", () => stream && stream.getTracks().forEach(t => t.stop()));
startCamera();
</script>
</body>
</html>
